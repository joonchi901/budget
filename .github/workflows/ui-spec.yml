name: UI specification
on:
  pull_request:
    paths:
      - 'src/**'
      - 'public/**'
      - '.storybook/**'
      - 'scripts/*storybook*'
      - 'scripts/check-ui-spec.mjs'
      - 'package*.json'
      - 'tsconfig.json'
      - '.github/workflows/ui-spec.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - '.storybook/**'
      - 'scripts/*storybook*'
      - 'scripts/check-ui-spec.mjs'
      - 'package*.json'
      - 'tsconfig.json'
      - '.github/workflows/ui-spec.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ui-spec-${{ github.ref }}
  cancel-in-progress: true
jobs:
  specification:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      STORYBOOK_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm run build:storybook
      - run: npm run test:storybook
      - run: npx playwright test tests/e2e/rooms.spec.ts tests/e2e/controls.spec.ts tests/e2e/design.spec.ts
      - uses: actions/upload-artifact@v4
        with:
          name: uga-ui-specification
          path: storybook-static/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: uga-ui-validation
          path: |
            output/storybook/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
